[project]
name = "docx-anonymizer-ner-train"
version = "1.1.0"
description = "Training, export and quantization of the NER model for DOCX Anonymizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.46,<5",
    "datasets>=3.0",
    "seqeval>=1.2.2",
    "optimum[onnxruntime]>=1.23",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "accelerate>=1.0",
    "numpy",
    "pyyaml",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
